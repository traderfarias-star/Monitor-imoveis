name: Monitor de Imoveis

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  checar-anuncios:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Rodar o monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Salvar historico de anuncios vistos
        run: |
          git config --global user.name "monitor-bot"
          git config --global user.email "monitor-bot@users.noreply.github.com"
          git add anuncios_vistos.db
          git diff --staged --quiet || git commit -m "Atualiza historico de anuncios"
          git push
